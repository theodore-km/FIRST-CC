<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 番茄主体渐变 -->
    <radialGradient id="tomatoGrad" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="35%" stop-color="#EE4444"/>
      <stop offset="70%" stop-color="#DD2C2C"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>

    <!-- 高光渐变 -->
    <radialGradient id="shineGrad" cx="38%" cy="32%" r="35%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 茎叶渐变 -->
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>

    <!-- 底部阴影 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- 背景（可选，透明背景用于 ICO）-->

  <!-- 底部阴影 -->
  <ellipse cx="256" cy="440" rx="120" ry="22" fill="url(#shadowGrad)"/>

  <!-- 番茄主体 -->
  <path d="
    M 160 180
    C 160 130, 200 95, 256 95
    C 312 95, 352 130, 352 180
    C 352 190, 355 200, 355 215
    L 355 300
    C 355 380, 315 420, 256 420
    C 197 420, 157 380, 157 300
    L 157 215
    C 157 200, 160 190, 160 180
    Z
  " fill="url(#tomatoGrad)"/>

  <!-- 番茄顶部凹陷 -->
  <path d="
    M 200 130
    C 220 145, 292 145, 312 130
    C 300 118, 275 110, 256 110
    C 237 110, 212 118, 200 130
    Z
  " fill="#C62828" opacity="0.5"/>

  <!-- 番茄侧面纹理（轻微的分瓣线条）-->
  <path d="M 256 110 C 256 110, 250 250, 256 420" stroke="#C62828" stroke-width="2.5" fill="none" opacity="0.25"/>
  <path d="M 210 125 C 195 200, 190 320, 210 410" stroke="#C62828" stroke-width="1.5" fill="none" opacity="0.15"/>
  <path d="M 302 125 C 317 200, 322 320, 302 410" stroke="#C62828" stroke-width="1.5" fill="none" opacity="0.15"/>

  <!-- 高光 -->
  <ellipse cx="220" cy="200" rx="55" ry="70" fill="url(#shineGrad)"/>

  <!-- 小高光点 -->
  <ellipse cx="200" cy="170" rx="12" ry="16" fill="rgba(255,255,255,0.45)"/>

  <!-- 茎 -->
  <rect x="250" y="62" width="12" height="55" rx="6" fill="url(#stemGrad)"/>

  <!-- 左叶 -->
  <path d="
    M 256 90
    C 240 80, 210 70, 185 78
    C 200 68, 230 65, 250 78
    Z
  " fill="url(#leafGrad)"/>

  <!-- 右叶 -->
  <path d="
    M 256 90
    C 272 80, 302 70, 327 78
    C 312 68, 282 65, 262 78
    Z
  " fill="url(#leafGrad)"/>

  <!-- 顶部小叶 -->
  <path d="
    M 256 85
    C 248 72, 240 60, 245 50
    C 250 60, 254 70, 256 85
    Z
  " fill="#66BB6A"/>
  <path d="
    M 256 85
    C 264 72, 272 60, 267 50
    C 262 60, 258 70, 256 85
    Z
  " fill="#66BB6A"/>
</svg>
